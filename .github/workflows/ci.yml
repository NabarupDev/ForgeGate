name: ForgeGate CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  validate:
    name: Build, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgegate
          POSTGRES_PASSWORD: TEST_ONLY_CI_POSTGRES_PASSWORD
          POSTGRES_DB: forgegate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js & Restore pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Schema Validation
        env:
          DATABASE_URL: "postgresql://forgegate:TEST_ONLY_CI_POSTGRES_PASSWORD@localhost:5432/forgegate_db?schema=public"
        run: pnpm exec prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://forgegate:TEST_ONLY_CI_POSTGRES_PASSWORD@localhost:5432/forgegate_db?schema=public"
        run: pnpm run prisma:generate

      - name: Build Monorepo Workspace
        run: pnpm run build

      - name: Lint Code
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        env:
          DATABASE_URL: "postgresql://forgegate:TEST_ONLY_CI_POSTGRES_PASSWORD@localhost:5432/forgegate_db?schema=public"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          JWT_ACCESS_SECRET: "TEST_ONLY_CI_JWT_ACCESS_SECRET_12345"
          JWT_REFRESH_SECRET: "TEST_ONLY_CI_JWT_REFRESH_SECRET_12345"
        run: pnpm run test:unit

      - name: Run Failure Injection & Matrix Integration Tests
        env:
          DATABASE_URL: "postgresql://forgegate:TEST_ONLY_CI_POSTGRES_PASSWORD@localhost:5432/forgegate_db?schema=public"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          JWT_ACCESS_SECRET: "TEST_ONLY_CI_JWT_ACCESS_SECRET_12345"
          JWT_REFRESH_SECRET: "TEST_ONLY_CI_JWT_REFRESH_SECRET_12345"
        run: pnpm run test:integration

      - name: Docker Build Validation (Root Dockerfile)
        run: docker build -t forgegate-app:ci .

      - name: Docker Build Validation (API Gateway Dockerfile)
        run: docker build -f infra/docker/Dockerfile.api-gateway -t forgegate-api-gateway:ci .
