version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgegate_app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-forgegate_user}:${POSTGRES_PASSWORD:-DEV_ONLY_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forgegate_db}?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-DEV_ONLY_JWT_ACCESS_SECRET_CHANGE_IN_PROD}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-DEV_ONLY_JWT_REFRESH_SECRET_CHANGE_IN_PROD}
    networks:
      - forgegate_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: forgegate_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgegate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DEV_ONLY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-forgegate_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forgegate_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgegate_user} -d ${POSTGRES_DB:-forgegate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: forgegate_redis
    volumes:
      - redis_data:/data
    networks:
      - forgegate_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: forgegate_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - forgegate_internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: forgegate_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - forgegate_internal
    restart: always

networks:
  forgegate_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
